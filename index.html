<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>AI Engineering Assistant</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            min-height: 100vh;
            background: #0f172a;
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 900px;
            background: #1e293b;
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.4);
        }

        .header {
            text-align: center;
            margin-bottom: 30px;
        }

        .logo {
            font-size: 50px;
            margin-bottom: 10px;
        }

        h1 {
            font-size: 32px;
            margin-bottom: 10px;
        }

        .subtitle {
            color: #94a3b8;
            font-size: 16px;
        }

        .features {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 15px;
            margin-bottom: 30px;
        }

        .feature {
            background: #334155;
            padding: 20px;
            border-radius: 15px;
            text-align: center;
        }

        .feature-icon {
            font-size: 30px;
            margin-bottom: 8px;
        }

        .feature h3 {
            margin-bottom: 5px;
        }

        .feature p {
            color: #cbd5e1;
            font-size: 14px;
        }

        .chat-box {
            background: #0f172a;
            border-radius: 15px;
            padding: 20px;
        }

        .chat-box h2 {
            margin-bottom: 15px;
        }

        .input-area {
            display: flex;
            gap: 10px;
        }

        input {
            flex: 1;
            padding: 15px;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            outline: none;
        }

        button {
            padding: 15px 25px;
            border: none;
            border-radius: 10px;
            background: #3b82f6;
            color: white;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background: #2563eb;
        }

        .response {
            margin-top: 15px;
            padding: 15px;
            background: #1e293b;
            border-radius: 10px;
            display: none;
        }

        @media (max-width: 600px) {
            .features {
                grid-template-columns: 1fr;
            }

            .input-area {
                flex-direction: column;
            }
        }
    </style>
</head>

<body>

    <div class="container">

        <div class="header">
            <div class="logo">🤖</div>

            <h1>AI Engineering Assistant</h1>

            <p class="subtitle">
                Your AI assistant for coding, electronics and creativity
            </p>
        </div>


        <div class="features">

            <div class="feature">
                <div class="feature-icon">💻</div>
                <h3>Coding</h3>
                <p>Python, C, C++, HTML and more</p>
            </div>

            <div class="feature">
                <div class="feature-icon">⚡</div>
                <h3>Electronics</h3>
                <p>Circuits, components and projects</p>
            </div>

            <div class="feature">
                <div class="feature-icon">🎤</div>
                <h3>Voice</h3>
                <p>Talk with your AI assistant</p>
            </div>

            <div class="feature">
                <div class="feature-icon">📷</div>
                <h3>Vision</h3>
                <p>Understand images and circuits</p>
            </div>

        </div>


        <div class="chat-box">

            <h2>💬 Ask the Assistant</h2>

            <div class="input-area">

                <input
                    type="text"
                    id="userInput"
                    placeholder="Type your question..."
                >

                <button onclick="sendMessage()">
                    Send
                </button>

            </div>

            <div id="response" class="response"></div>

        </div>

    </div>


    <script>
        function sendMessage() {

    const input = document.getElementById("userInput");
    const response = document.getElementById("response");

    const message = input.value.trim();

    if (message === "") {
        return;
    }

    response.style.display = "block";

    response.innerHTML = `
        <strong>You:</strong><br>
        ${message}
        <br><br>
        <strong>🤖 AI Engineering Assistant:</strong><br>
        I received your message. My AI brain will be connected in the next stage!
    `;

    input.value = "";
        }

    </script>

</body>
</html>
